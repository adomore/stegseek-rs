name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      # --locked keeps the committed Cargo.lock honest; the Dockerfile builds
      # with it too, so lock drift must fail here rather than in `docker build`.
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The EN/ZH README pair must stay structurally identical: same heading
      # levels, same tables, same code blocks, same inline literals. Drift is
      # invisible to a reader who only opens one language.
      - name: EN/ZH lockstep
        run: python3 scripts/lockstep.py README.en.md README.md
